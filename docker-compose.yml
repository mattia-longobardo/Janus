name: projects

services:

# Janus # --------------------------------------------------------------------------------------------------------------

  janus:
    build: .
    image: janus:latest
    container_name: janus
    user: "1000:1000"
    command: api
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@postgres:5432/janus
      - JANUS_INTERNAL_TOKEN=${JANUS_INTERNAL_TOKEN}
      - JANUS_PIHOLE_URL=http://192.168.1.220:1000
      - JANUS_PIHOLE_PASSWORD=${JANUS_PIHOLE_PASSWORD}
      - TZ=Europe/Rome
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "autoheal=true"
    networks:
      - db_internal

# Janus Worker # ---------------------------------------------------------------------------------------------------------

  janus-worker:
    image: janus:latest
    container_name: janus-worker
    user: "1000:1000"
    depends_on:
      janus:
        condition: service_healthy
    command: worker
    environment:
      - JANUS_DATABASE_URL=postgresql+psycopg://janus:${DB_JANUS_PASSWORD}@postgres:5432/janus
      - JANUS_PIHOLE_URL=http://192.168.1.220:1000
      - JANUS_PIHOLE_PASSWORD=${JANUS_PIHOLE_PASSWORD}
      - JANUS_SYNC_MODE=dry-run
      - TZ=Europe/Rome
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/janus-worker.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/janus-worker.heartbeat) )) -lt 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
    networks:
      - db_internal

networks:
  db_internal:
    external: true
